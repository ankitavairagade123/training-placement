spring.application.name=Training_and_Placement

spring.datasource.url=jdbc:mysql://localhost:3306/training_placement
spring.datasource.username=root
spring.datasource.password=root123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka is used only for background work such as mail.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=tpms-mail
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=T_And_P.Training_and_Placement.event
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.fail-fast=false

tpms.kafka.planner-published-topic=planner-published
tpms.kafka.application-submitted-topic=application-submitted